<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Forms</title>
</head>
<body>
    <h1>Formulário</h1>

        <p>
        <label for="Senha"></label>
        <input type="password" placeholder="Senha" id="Senha">
        </p>

        <p>
        <label for="esquisito"></label>
        <input type="number" placeholder="esquisito" id="esquisito">
        </p>

        <p>
        <label for="e-mail"></label>
        <input type="email" placeholder="Seu e-mail" id="e-mail">

        <input type="submit" value="Log In">

        <textarea name="" id=""></textarea>
        
        <p>
            //Estado Civil
        <input type="radio" id="Solteiro" name="estado-civil">
